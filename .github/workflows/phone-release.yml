name: Phone release APK

# A signed release APK of the Android app. A tag `phone-v<version>` (e.g. phone-v1.0.0) builds it and attaches it to
# a GitHub release; running the workflow by hand builds it as an artifact only. The keystore and its password come
# from the repository secrets NOTERIV_RELEASE_KEYSTORE_BASE64 and NOTERIV_RELEASE_STORE_PASSWORD (the same key as on
# the owner's machine; see docs/plans/2026-10-26-phien-k-m4-ghi-nhanh-ci-release.md). Before tagging, raise
# `expo.android.versionCode` in phone/app.json: Android refuses an update with the same or a lower code.
on:
  push:
    tags: ["phone-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phone/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Generate the Android project
        run: npx expo prebuild -p android --no-install

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTERIV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "NOTERIV_RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noteriv-release.jks"

      - name: Build the release APK
        working-directory: phone/android
        env:
          NOTERIV_RELEASE_STORE_FILE: ${{ runner.temp }}/noteriv-release.jks
          NOTERIV_RELEASE_STORE_PASSWORD: ${{ secrets.NOTERIV_RELEASE_STORE_PASSWORD }}
          NOTERIV_RELEASE_KEY_ALIAS: noteriv
        # Phones in use are ARM; leaving out the x86 emulator ABIs halves the APK.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          name="noteriv-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noteriv-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/phone-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Noteriv Android ${tag#phone-v}" --notes "Android APK, signed with the Noteriv release key."
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
